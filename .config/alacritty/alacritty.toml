[general]
import = []
live_config_reload = true

[window]
padding = { x = 5, y = 5 }
dynamic_padding = false
decorations = "None"
opacity = 0.90

[scrolling]
history = 100000

[font]
normal = {
    family = 'JetBrainsMono NFM',
    style = 'ExtraLight'
}
size = 13

[colors]
primary = {
    foreground = "#f8f8f2",
    background = "#272822",
}
cursor = {
    text = "CellBackground",
    cursor = "CellForeground"
}

[colors.normal]
black = "#333333"
red = "#f92672"
green = "#a6e22e"
yellow = "#e2e22e"
blue = "#6a7ec8"
magenta = "#8c6bc8"
cyan = "#56adbc"
white = "#e3e3dd"

[env]
TERM = "xterm-256color"

